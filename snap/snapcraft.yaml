name: vsingh-uptime-kuma
base: core24
version: '2.5.0'
title: vsingh-uptime-kuma
summary: A fancy self-hosted monitoring tool
description: |
  Uptime Kuma watches your services and tells you when one goes down. It
  monitors HTTP(S), TCP ports, ping, DNS, gRPC, MQTT, databases and more,
  keeps the history, and can publish a public status page.

  Notifications go to over ninety services, Telegram, Discord, Slack, email,
  webhooks and the rest, and fire on state changes rather than on every check.

  The web UI listens on port 3002 in this snap, not upstream's 3001, which is
  a common port for other web services to claim. Data lives in $SNAP_COMMON,
  so the database, uploads and screenshots survive refreshes and reverts. Back
  up /var/snap/vsingh-uptime-kuma/common and you have backed up everything.

  Ping and some other monitor types need a manual interface connection after
  install; see the README in the source repository.

  Built from upstream at tag 2.5.0. This is an unofficial package. Uptime Kuma
  is created and maintained by Louis Lam and its contributors; this snap only
  packages their work. Report packaging problems to
  github.com/Cruzh3r2107/snap-kuma-uptime/issues, not to upstream.
license: MIT
icon: snap/gui/vsingh-uptime-kuma.png
website: https://uptime.kuma.pet
source-code: https://github.com/Cruzh3r2107/snap-kuma-uptime
issues: https://github.com/Cruzh3r2107/snap-kuma-uptime/issues
contact: https://github.com/Cruzh3r2107/snap-kuma-uptime/issues
grade: stable
confinement: strict

apps:
  vsingh-uptime-kuma:
    command: bin/uptime-kuma-wrapper
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      # Manual-connect: only ICMP ping monitors need it. See README.md.
      - network-control
    environment:
      NODE_ENV: production
      DATA_DIR: $SNAP_COMMON/
      # 3002, not upstream's 3001: vsingh-sport-kiosk already binds 3001, and
      # on a host running both this crash-looped on EADDRINUSE.
      UPTIME_KUMA_PORT: "3002"

parts:
  uptime-kuma:
    plugin: nil
    source: https://github.com/louislam/uptime-kuma.git
    source-type: git
    source-tag: '2.5.0'
    source-depth: 1
    build-packages:
      - build-essential
      - python3
      - libatomic1
      - curl
      - ca-certificates
    stage-packages:
      - ca-certificates
      - iputils-ping
      - libatomic1
    override-build: |
      craftctl default

      set -eu

      # Deliberately the upstream tarball, NOT Ubuntu's nodejs package: the
      # archive build externalises Node's builtins to absolute paths under
      # /usr/share/nodejs, which resolve outside $SNAP under strict confinement
      # and abort the runtime with no AppArmor denial to explain it.
      NODE_VERSION="20.19.4"

      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) NODE_ARCH="x64" ;;
        arm64) NODE_ARCH="arm64" ;;
        armhf) NODE_ARCH="armv7l" ;;
        ppc64el) NODE_ARCH="ppc64le" ;;
        s390x) NODE_ARCH="s390x" ;;
        *) echo "Unsupported architecture: ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac

      NODE_TARBALL="node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz"
      NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TARBALL}"
      NODE_DIST="${CRAFT_PART_BUILD}/node-dist"
      mkdir -p "${NODE_DIST}"
      curl -fsSL "${NODE_URL}" | tar -xz --strip-components=1 -C "${NODE_DIST}"
      export PATH="${NODE_DIST}/bin:${PATH}"
      node --version
      npm --version

      cd "${CRAFT_PART_SRC}"

      # Full install incl. dev deps so vite can build the frontend; this also
      # compiles the native @louislam/sqlite3 addon via node-gyp.
      npm ci --no-audit --no-fund
      npm run build
      npm prune --omit=dev --no-audit --no-fund

      INSTALL="${CRAFT_PART_INSTALL}"
      mkdir -p "${INSTALL}/bin"
      install -Dm755 "${NODE_DIST}/bin/node" "${INSTALL}/bin/node"

      cp -r server "${INSTALL}/server"
      cp -r dist "${INSTALL}/dist"
      cp -r db "${INSTALL}/db"
      cp -r node_modules "${INSTALL}/node_modules"
      cp package.json "${INSTALL}/package.json"
      cp -r extra "${INSTALL}/extra"
      # server/server.js does require("../src/util") at runtime.
      cp -r src "${INSTALL}/src"

      # Trim the staged tree. Nothing removed here is loaded by
      # `node server/server.js` under NODE_ENV=production. License and NOTICE
      # files are always preserved (Snap Store requirement).
      NM="${INSTALL}/node_modules"

      find "${NM}" -type f -name '*.map' -delete
      find "${NM}" -type f -name '*.d.ts' -delete
      find "${NM}" -type f -name '*.ts' -delete

      find "${NM}" -type f -iname '*.md' \
        -not -iname 'license*'   -not -iname 'licence*' \
        -not -iname 'copying*'   -not -iname 'copyright*' \
        -not -iname 'notice*'    -not -iname 'unlicense*' \
        -delete

      find "${NM}" -type d \( -name test -o -name tests -o -name __tests__ \) \
        -prune -exec rm -rf {} +
      find "${NM}" -type d \( -iname example -o -iname examples \) \
        -prune -exec rm -rf {} +

      # The native addon is already compiled.
      rm -rf "${NM}/@louislam/sqlite3/deps"

      # Keep only the oracledb binary matching this build's arch.
      if [ -d "${NM}/oracledb/build/Release" ]; then
        find "${NM}/oracledb/build/Release" -type f -name '*.node' \
          ! -name "*linux-${NODE_ARCH}.node" -delete
      fi

      # stage-packages never runs ca-certificates' postinst, so the bundle that
      # NODE_EXTRA_CA_CERTS points at does not otherwise exist. Without this the
      # individual mozilla/*.crt files ship but Node silently ignores them.
      mkdir -p "${INSTALL}/etc/ssl/certs"
      cat "${INSTALL}"/usr/share/ca-certificates/mozilla/*.crt \
        > "${INSTALL}/etc/ssl/certs/ca-certificates.crt"
      test -s "${INSTALL}/etc/ssl/certs/ca-certificates.crt"

      rm -rf "${INSTALL}/usr/share/man" \
             "${INSTALL}/usr/share/lintian" \
             "${INSTALL}/usr/share/bug"
      if [ -d "${INSTALL}/usr/share/doc" ]; then
        find "${INSTALL}/usr/share/doc" -type f -not -name 'copyright' -delete
      fi
      find "${INSTALL}" -type d -name '__pycache__' -prune -exec rm -rf {} +

      # Upstream ships node unstripped; the dynamic symbol table is preserved.
      strip "${INSTALL}/bin/node"

      # Playwright's trace-viewer UI, reached only via `playwright show-trace`.
      rm -rf "${NM}/playwright-core/lib/vite"

      rm -f "${NM}/node-radius-utils/radius-utils-example.gif" \
            "${NM}/.package-lock.json"

      # cwd must be $SNAP: the server serves ./dist relative to it.
      cat > "${INSTALL}/bin/uptime-kuma-wrapper" <<'WRAPPER'
      #!/bin/sh
      set -e
      export PATH="$SNAP/bin:$SNAP/usr/bin:$SNAP/usr/sbin:$PATH"
      export NODE_EXTRA_CA_CERTS="${NODE_EXTRA_CA_CERTS:-$SNAP/etc/ssl/certs/ca-certificates.crt}"
      cd "$SNAP"
      exec "$SNAP/bin/node" "$SNAP/server/server.js" "$@"
      WRAPPER
      chmod 755 "${INSTALL}/bin/uptime-kuma-wrapper"
